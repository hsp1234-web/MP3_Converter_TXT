<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳凰轉錄儀 v1.1</title>
    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; background-color: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background-color: #2a2a2a; border-radius: 10px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 800px; }
        h1 { color: #ff9800; text-align: center; border-bottom: 2px solid #ff9800; padding-bottom: 10px; margin-bottom: 20px; }
        .status-bar { background-color: #333; padding: 15px; border-radius: 5px; margin-bottom: 20px; text-align: center; font-size: 1.1em; }
        .status-light { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background-color: #f44336; margin-right: 10px; vertical-align: middle; transition: background-color 0.5s; }
        .status-light.connected { background-color: #4caf50; }
        .upload-section { text-align: center; border: 2px dashed #555; padding: 40px; border-radius: 10px; margin-bottom: 20px; transition: background-color 0.3s; }
        .upload-section.dragover { background-color: #3a3a3a; }
        #file-input { display: none; }
        .upload-label { cursor: pointer; background-color: #ff9800; color: #1a1a1a; padding: 12px 25px; border-radius: 5px; font-weight: bold; transition: background-color 0.3s; }
        .upload-label:hover { background-color: #fb8c00; }
        .file-list { margin-top: 20px; }
        .file-item { background-color: #333; padding: 15px; border-radius: 5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .file-name { font-weight: bold; }
        .progress-bar { width: 100%; background-color: #444; border-radius: 5px; overflow: hidden; height: 25px; margin-top: 5px; }
        .progress { background-color: #4caf50; width: 0%; height: 100%; text-align: center; line-height: 25px; color: white; transition: width 0.4s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h1>鳳凰轉錄儀</h1>
        <div class="status-bar">
            <span id="status-light" class="status-light"></span>
            <span id="status-text">正在連線至後端...</span>
        </div>
        <div id="upload-box" class="upload-section">
            <input type="file" id="file-input" multiple>
            <label for="file-input" class="upload-label">選擇檔案或拖曳至此</label>
            <p style="color: #888; margin-top: 15px;">支援 MP3, WAV, M4A 等格式</p>
        </div>
        <div class="file-list" id="file-list">
            <!-- 檔案項目將會動態新增於此 -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusLight = document.getElementById('status-light');
            const statusText = document.getElementById('status-text');
            const uploadBox = document.getElementById('upload-box');
            const fileInput = document.getElementById('file-input');
            const fileList = document.getElementById('file-list');
            const clientId = `web-client-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

            let socket;

            function connectWebSocket() {
                socket = new WebSocket(`ws://${window.location.host}/ws/${clientId}`);

                socket.onopen = () => {
                    console.log('WebSocket 連線成功');
                    statusLight.classList.add('connected');
                    statusText.textContent = '系統待命中';
                };

                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    console.log('收到訊息:', data);
                    // 在此處理後端傳來的各種訊息 (例如：進度更新)
                    if (data.type === 'status') {
                        statusText.textContent = data.message;
                    } else if (data.type === 'progress') {
                        updateFileProgress(data.filename, data.progress, data.status);
                    } else if (data.type === 'transcription_complete') {
                        updateFileStatus(data.filename, `完成: ${data.transcription.substring(0, 50)}...`);
                    }
                };

                socket.onclose = () => {
                    console.log('WebSocket 連線關閉，5秒後嘗試重連...');
                    statusLight.classList.remove('connected');
                    statusText.textContent = '連線中斷，嘗試重連...';
                    setTimeout(connectWebSocket, 5000);
                };

                socket.onerror = (error) => {
                    console.error('WebSocket 錯誤:', error);
                    statusText.textContent = '連線錯誤';
                    socket.close();
                };
            }

            function handleFiles(files) {
                [...files].forEach(file => {
                    if (fileList.querySelector(`[data-filename="${file.name}"]`)) {
                        alert(`檔案 "${file.name}" 已經在佇列中。`);
                        return;
                    }

                    addFileToList(file);
                    uploadFile(file);
                });
            }

            function addFileToList(file) {
                const fileId = `file-${Date.now()}`;
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.dataset.filename = file.name;
                fileItem.id = fileId;

                fileItem.innerHTML = `
                    <div>
                        <div class="file-name">${file.name}</div>
                        <div class="progress-bar">
                            <div class="progress" style="width: 0%;">0%</div>
                        </div>
                        <div class="file-status" style="color: #aaa; font-size: 0.9em; margin-top: 5px;">等待上傳...</div>
                    </div>
                `;
                fileList.appendChild(fileItem);
            }

            function updateFileProgress(filename, progress, statusText) {
                const fileItem = fileList.querySelector(`[data-filename="${filename}"]`);
                if (fileItem) {
                    const progressBar = fileItem.querySelector('.progress');
                    const statusDiv = fileItem.querySelector('.file-status');
                    progressBar.style.width = `${progress}%`;
                    progressBar.textContent = `${progress}%`;
                    statusDiv.textContent = statusText;
                }
            }
             function updateFileStatus(filename, statusText) {
                const fileItem = fileList.querySelector(`[data-filename="${filename}"]`);
                if (fileItem) {
                    const statusDiv = fileItem.querySelector('.file-status');
                    statusDiv.textContent = statusText;
                }
            }


            async function uploadFile(file) {
                 updateFileStatus(file.name, '正在上傳...');
                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('上傳成功:', result);
                        updateFileProgress(file.name, 100, '上傳完成，等待處理');
                    } else {
                        console.error('上傳失敗:', response.statusText);
                        updateFileStatus(file.name, `上傳失敗: ${response.statusText}`);
                    }
                } catch (error) {
                    console.error('上傳請求錯誤:', error);
                    updateFileStatus(file.name, `上傳錯誤: ${error.message}`);
                }
            }

            // Drag and Drop event listeners
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadBox.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                uploadBox.addEventListener(eventName, () => uploadBox.classList.add('dragover'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('dragover'), false);
            });

            uploadBox.addEventListener('drop', (e) => {
                handleFiles(e.dataTransfer.files);
            }, false);

            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });

            // Initial connection
            connectWebSocket();
        });
    </script>
</body>
</html>
